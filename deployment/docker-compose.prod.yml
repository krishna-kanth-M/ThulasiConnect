services:
  postgres:
    image: postgres:16-alpine
    container_name: thulasiconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thulasiconnect_prod}
      POSTGRES_USER: ${POSTGRES_USER:-thulasi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thulasi_admin} -d ${POSTGRES_DB:-thulasiconnect_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: thulasiconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ThulasiConnect
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thulasi_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thulasiconnect_prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://thulasiconnect.vercel.app}
      AUDIO_STORAGE_ENABLED: "false"
      ESCALATION_BRANCH_MANAGER_OVERDUE_MINUTES: "60"
      ESCALATION_ZONAL_MANAGER_OVERDUE_MINUTES: "240"
      ESCALATION_OWNER_OVERDUE_MINUTES: "1440"
    ports:
      - "8000:8000"

volumes:
  pgdata:
